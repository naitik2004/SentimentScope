model:
  name: distilbert-base-uncased
  num_labels: 3
training:
  epochs: 3
  batch_size: 32
  learning_rate: 2.0e-5
  warmup_steps: 500
  weight_decay: 0.01
  max_length: 128
data:
  dataset: sentiment140
  train_size: 40000
  val_size: 8000
  test_size: 2000
output:
  checkpoint_dir: ./checkpoints
  model_name: distilbert-sentiment-3class
